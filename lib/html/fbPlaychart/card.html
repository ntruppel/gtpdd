<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<title>Playchart card</title>
<!-- Rendered locally into the stats.gtpdd.dog index card image, never published, so inline CSS is fine -->
<!-- The latest game as a drive chart: the final score over one arrow per drive on the playchart's field -->
<style>
:root { --field: $fieldColor; --text-primary: #0b0b0b; --text-secondary: #3f4a3c; --text-muted: #5d6a59; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: var(--field); display: flex; flex-direction: column;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text-primary); }

/* Scoreboard: away on the left, home on the right; equal outer columns keep FINAL centered */
.score { flex: none; height: 104px; display: grid; grid-template-columns: 1fr auto 1fr;
  align-items: center; gap: 36px; padding: 0 40px; }
.side { display: flex; align-items: center; gap: 24px; }
.side.away { justify-content: flex-end; }
.side.home { justify-content: flex-start; }
.side img { height: 66px; width: auto; max-width: 110px; object-fit: contain; }
.pts { font-size: 54px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pts.lost { color: var(--text-muted); }
.mid { text-align: center; color: var(--text-secondary); font-size: 21px; line-height: 1.25; }
.mid .final { font-weight: 700; letter-spacing: 0.08em; color: #cb333b; }

/* The field fills the rest, end zone to end zone */
.field { flex: 1; min-height: 0; }
.field svg { display: block; width: 100%; height: 100%; }
.result { font-size: 16px; font-weight: 600; fill: #333; paint-order: stroke;
  stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
.result.score-play { font-weight: 800; fill: #000; }
.divider-label { font-size: 15px; font-weight: 700; fill: #000; }
</style>
</head>
<body>
<div class='score'>
$scoreboard
</div>
<div class='field'>
$field
</div>
</body>
</html>
