<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<title>Sun Belt Predictor card</title>
<!-- Rendered locally into the stats.gtpdd.dog index card image, never published, so inline CSS is fine -->
<!-- The page's Current Predicted Championship card, scaled up so it reads at card size -->
<style>
:root {
  --page: #0b2240; --surface-1: #ffffff; --text-primary: #0b0b0b;
  --text-secondary: #52514e; --text-muted: #6f6d68; --gold: #f5a706;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: var(--page); padding: 24px;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.matchup { height: 100%; display: flex; flex-direction: column; text-align: center;
  color: var(--text-primary); border: 3px solid var(--gold); border-radius: 18px;
  padding: 30px 40px 34px;
  background: url('$starburst') center bottom / auto 100% no-repeat, var(--surface-1); }
h2 { margin: 0; color: var(--text-muted); font-size: 28px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em; }
.pair { flex: 1; display: flex; align-items: center; justify-content: center; gap: 64px; }
.side { flex: 0 1 430px; min-width: 0; }
.side img { display: block; margin: 0 auto; height: 220px; width: auto; max-width: 100%;
  object-fit: contain; }
.name { margin-top: 14px; font-size: 44px; font-weight: 600; line-height: 1.15; }
.odds { color: var(--text-secondary); font-size: 27px; line-height: 1.35; }
.vs { color: var(--gold); font-size: 60px; font-weight: 700; }
</style>
</head>
<body>
<section class='matchup'>
<h2>Current predicted championship:</h2>
<div class='pair'>
$pair
</div>
</section>
</body>
</html>
