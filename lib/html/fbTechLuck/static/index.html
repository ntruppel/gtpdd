<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tech Luck Test</title>
	<link rel="stylesheet" href="TechLuck.css">
</head>
<body data-page="start">

	<div id="wrapper">
		<h1>How lucky are you as a Tech fan?</h1>
		<img src="site icon trans.png" alt="gtpdd logo" width="80" height="80" class="center">

		<form id="years">
			<h3><label for="fname">What is your name?</label></h3>
			<input type="text" id="fname" name="fname" autocomplete="given-name">

			<h3><label for="firstYear">What was the first year you attended a Tech game?</label></h3>
			<select class="selectYear" id="firstYear" name="firstYear"></select>

			<h3><label for="lastYear">When was the most recent Tech game you attended?</label></h3>
			<select class="selectYear" id="lastYear" name="lastYear"></select>

			<p id="answer" class="error" hidden></p>

			<button type="button" id="submit">Next Step</button>
		</form>
	</div>

	<script src="games.js"></script>
	<script src="TechLuck.js"></script>
</body>
</html>
