<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<title>Record Predictor card</title>
<!-- Rendered locally into the stats.gtpdd.dog index card image, never published, so inline CSS is fine -->
<style>
:root {
  --page: #003087; --surface-1: #ffffff; --on-page: #ffffff; --on-page-muted: #c9d7f2;
  --text-secondary: #52514e; --text-muted: #6f6d68; --axis: #b9b7b0;
  --border: rgba(11,11,11,0.12); --series-1: #003087; --series-2: #cb333b;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: var(--page); color: var(--on-page); padding: 38px 48px 40px;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
.label { font-size: 30px; color: var(--on-page-muted); font-weight: 500; }
.value { font-size: 132px; font-weight: 700; line-height: 1; letter-spacing: -0.02em;
  margin-top: 6px; font-variant-numeric: tabular-nums; }
.run { font-size: 28px; color: var(--on-page-muted); text-align: right; padding-bottom: 12px; }
.card { flex: 1; margin-top: 22px; background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 18px; padding: 10px 20px 4px; }
.card svg { display: block; width: 100%; height: 100%; }
.baseline { stroke: var(--axis); stroke-width: 2; }
.axis-label { fill: var(--text-muted); font-size: 24px; font-variant-numeric: tabular-nums; }
.value-label { fill: var(--text-secondary); font-size: 24px; font-weight: 600; }
.note-label { fill: var(--text-muted); font-size: 21px; }
</style>
</head>
<body>
<div class='head'>
  <div>
    <div class='label'>Bowl Eligibility Chance</div>
    <div class='value'>$bowlOdds</div>
  </div>
  <div class='run'>$runLabel</div>
</div>
<div class='card'>
$chart
</div>
</body>
</html>
